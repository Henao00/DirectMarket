<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DirectMarket - Plataforma de compra y venta directa entre usuarios con sistema de pago escrow seguro." />

    <!-- Seguridad: Content Security Policy basica para desarrollo -->
    <!-- En produccion se configura via Helmet en el backend y headers del servidor -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <title>DirectMarket - Compra y vende sin intermediarios</title>

    <!-- Favicon simple inline como SVG -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' x='15'>DM</text></svg>"
    />

    <!-- Inter font cargada tambien desde index.html para evitar FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Punto de montaje de la aplicacion React -->
    <div id="root"></div>

    <!-- Mensaje para navegadores sin JavaScript -->
    <noscript>
      <div style="text-align:center; padding:2rem; font-family:sans-serif;">
        DirectMarket requiere JavaScript para funcionar.
        Por favor habilita JavaScript en tu navegador.
      </div>
    </noscript>

    <!-- Entrada principal de Vite -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
